[paths]
video_dir = "data/source/videos"
model_path = "./models/Qwen3-VL-Embedding-8B"
profile_pic_dir = "data/source/profile_pics"
thumbnail_dir = "data/source/thumbnails"
speech_audio_dir = "data/source/audio"
audio_dir = "data/audio"
data_csv_path = "data/data.csv"

[download]
max_attempts = 3
retry_delay = 15
retry_jitter = 5
concurrency = 5

[parse]
max_attempts = 3
# HikerAPI is rate-limited, so back off longer than the CDN download stage.
retry_delay = 30
retry_jitter = 5
concurrency = 5

[filter]
min_video_duration = 3
max_video_duration = 80
min_taken_at = 1640995200
creator_min_median_views = 10000
min_eligible_clips_per_user = 30
global_low_percentile = 5
global_high_percentile = 99
creator_low_z_threshold = -3.5
selection_pool_percent = 0.20
selected_clips_per_user = 10
selection_random_seed = 42

[speech]
whisper_model = "large-v3-turbo"
commit_every = 50
translate_model = "google/translategemma-4b-it"
translate_target_lang = "en"
translation_max_chars = 1000
translate_max_new_tokens = 200
# GPU decode batch width for translation (throughput-only, not fingerprinted).
translate_batch_size = 16
logprob_threshold = -0.8
compression_threshold = 2.4
min_meaningful_chars = 8
dirty_min_chars = 5
dirty_min_letter_ratio = 0.3
vad_enabled = true
vad_sampling_rate = 16000
vad_threshold = 0.5
vad_min_speech_ms = 250
vad_min_silence_ms = 100
vad_speech_pad_ms = 150
vad_min_total_speech_s = 0.5
vad_ffmpeg_timeout_s = 60

[captions]
commit_every = 50
translate_model = "google/translategemma-4b-it"
translate_target_lang = "en"
translation_max_chars = 1000
translate_max_new_tokens = 200
# GPU decode batch width for translation (throughput-only, not fingerprinted).
translate_batch_size = 16

[embeddings]
exclude_disqualified_users = true
embed_max_length = 32768
adaptive_max_frames = 96
adaptive_default_fps = 2.0
# Concurrent embed lanes per worker. Two lanes overlap CPU frame-decode +
# tokenize of one clip with GPU forward of another; serializes on CUDA but
# closes the inter-clip gap. Throughput-only, not fingerprinted.
inflight = 2
# Per-lane cross-clip GPU coalescing: each lane leases up to N same-case
# jobs and packs them into one padded forward. Default 1 (no coalescing).
# Measured: at adaptive_max_frames=96 the embedder is a single long-context
# forward (~24k visual tokens per clip), so batch=2 ≈ 49k-token forward
# delivered ~0.90× per-clip throughput vs batch=1 with +56% peak memory —
# the embedder has no per-step amortization to recover (unlike the labels
# decoder). Keep at 1 for the configured frame count; only raise if you
# benchmark a shorter-frame case and confirm a gain. Throughput-only, not
# fingerprinted.
embed_batch_size = 1
embed_batch_fill_ms = 50
# ── distributed coordinator / worker ──
coordinator_bind_host = "0.0.0.0"
coordinator_bind_port = 8765
lease_ttl_s = 600
max_attempts = 3
worker_request_timeout_s = 120
worker_max_retries = 3
# ── Gemini Embedding 2 case ──
gemini_enabled           = false
gemini_model             = "gemini-embedding-2-preview"
gemini_output_dim        = 3072
gemini_max_video_seconds = 120
gemini_max_audio_seconds = 80
gemini_request_timeout_s = 60
gemini_max_retries       = 5

[audio_extraction]
audio_bitrate_kbps       = 128
audio_sample_rate_hz     = 44100
audio_extract_timeout_s  = 60

[search]
# Production grid tuned 2026-05-19 from analyze_cluster_params + analyze_cluster_lab.
# Centered on the empirically-best 14-cluster eom region for the sandwich case.
# Champion config: n_components=20, n_neighbors=10, min_dist=0.0, cosine,
#                  min_cluster_size=15, eom -> 14 clusters, quality=0.591.
# Dropped values (empirical failure rates):
#   umap_metric=euclidean (73% fail), umap_min_dist=0.05 (uniformly worse),
#   umap_n_neighbors in {15, 30} (lower quality, wrong cluster count),
#   hdbscan_min_cluster_size in {25, 35+} (77% fail at 25),
#   hdbscan_cluster_selection_method=leaf (produces 25+ clusters).
# New axis hdbscan_min_samples surfaced as the cleanest cluster-count + noise dial.
# Grid size: 5 * 3 * 1 * 2 * 4 * 3 * 1 = 360 configs per case.
umap_n_components = [15, 20, 25, 30, 35]
umap_n_neighbors = [8, 10, 12]
umap_min_dist = [0.0]
umap_metrics = ["cosine", "correlation"]
umap2d_n_neighbors = 15
umap2d_min_dist = 0.1
umap2d_metrics = ["cosine"]
hdbscan_min_cluster_size = [13, 15, 17, 20]
hdbscan_min_samples = [5, 10, 15]
# Both selection methods are now swept (grid doubles to 720/case): eom gives
# persistence-stable clusters (prone to one mega-cluster on dense embeddings);
# leaf gives finer, balanced bottom-of-tree clusters. The max_cluster_frac cap
# below reins in eom's mega-cluster; leaf self-limits.
hdbscan_selection = ["eom", "leaf"]
# Cap the largest eom cluster at 22.5% of analysis users (the dense embedding
# core was collapsing into one 35-44% mega-cluster under uncapped eom).
hdbscan_max_cluster_frac = 0.225
# Strip the dominant shared component per case before UMAP. auditory is
# near-degenerate (mean pairwise cosine ~0.97) so it needs centering;
# sandwich/video benefit from full z-scoring; the text-only spoken/textual
# cases cluster best raw.
embedding_preprocess = { auditory = "center", sandwich = "standardize", video = "standardize", spoken = "none", textual = "none" }
random_state = 42

[validation]
plateau_drop_threshold = 0.05
# Raised from 0.30: the balanced (leaf / capped-eom) solutions that break the
# mega-cluster trade noise for granularity and sit at ~0.33-0.38 noise.
max_noise_ratio = 0.35
min_clusters = 3
max_clusters = 20
# Backstop against the mega-cluster: reject any run whose largest cluster is
# more than 40% of assigned users. Complements the eom max_cluster_frac cap and
# also guards leaf runs.
max_dominance = 0.4

[storage]
backend = "s3"
# bucket + region are account-specific: set them in .env (STORAGE_BUCKET,
# STORAGE_REGION) — they default to RUNPOD_NETWORK_VOLUME_ID and
# RUNPOD_DATA_CENTER_ID, since the bucket is the volume and region is its DC.
bucket = ""
prefix = "videos/"
region = ""
# Thread-pool width for the upload stage's verify+upload scan. Every rerun HEADs
# every selected clip (bucket is authoritative); these are tiny calls, so a wide
# pool keeps reruns fast.
verify_concurrency = 64
# How many real video uploads run at once. Kept well below verify_concurrency so
# a cold bucket can't fire a verify-width burst of multi-MB PUTs at the endpoint.
upload_concurrency = 8

[runpod]
# Container image the pods run (push services/embedder/Dockerfile to a registry).
# For a PUBLIC image, set this. For a PRIVATE image, leave it blank and set
# template_id below (the SDK cannot pass registry auth on a bare image).
image = ""
# RunPod template id carrying the private-registry pull credential. When set,
# pods launch from this template's image; `image` above is ignored.
template_id = ""
# Account-specific values live in .env (RUNPOD_DATA_CENTER_ID,
# RUNPOD_NETWORK_VOLUME_ID, RUNPOD_TEMPLATE_ID, RUNPOD_IMAGE) so this tracked
# file carries none. GPU selection: leave RUNPOD_GPU_TYPE_ID empty to auto-fetch
# in-stock types in the DC under the price cap, meeting the floors below, tried
# cheapest-first; or pin one (e.g. "NVIDIA RTX PRO 4500 Blackwell"). The
# defaults below are the fallback when the matching .env var is unset.
gpu_type_id = ""
gpu_max_price_hr = 0.80
gpu_min_vram_gb = 24
gpu_min_ram_gb = 30
# Re-fetch GPU availability and deploy any shortfall every N seconds during the
# embedding stage, until RUNPOD_POD_COUNT pods are up (thin stock keeps retrying).
gpu_poll_interval_s = 30.0
data_center_id = ""
network_volume_id = ""
volume_mount_path = "/runpod-volume"
container_disk_in_gb = 20
# Where pods read clip videos on the mounted volume. Must mirror the upload
# target: [storage].bucket over S3 lands at <volume_mount_path>/<[storage].prefix>,
# so pod_video_root has to equal that path or pods see an empty videos dir.
pod_video_root = "/runpod-volume/videos"
pod_model_path = "/runpod-volume/models/Qwen3-VL-Embedding-8B"
reconcile_path = ".runpod_fleet.json"

[mir]
binary_threshold = 0.5
music_min_confidence = 0.30
music_min_margin = 0.05
topk_genre = 10
topk_moodtheme = 10
topk_instrument = 10
inference_sample_rate = 16000
model_dir = "models/mir"
download_concurrency = 4
commit_every = 25
prefetch_queue_size = 2
http_timeout = 30.0
maest_checkpoint = "discogs-maest-30s-pw-519l-1.pb"
maest_input = "serving_default_melspectrogram"
maest_output = "StatefulPartitionedCall:0"
maest_patch_seconds = 30.0
effnet_checkpoint = "discogs-effnet-bs64-1.pb"
effnet_embed_output = "PartitionedCall:1"
maest_onnx_checkpoint = "discogs-maest-30s-pw-519l-1.onnx"
effnet_onnx_checkpoint = "discogs-effnet-bsdynamic-1.onnx"

[visualization]
export_dir = "data/visualization"
default_case = "sandwich"

[labels]
model_path        = "./models/Qwen3-VL-8B-Instruct"
frame_count       = 8
max_new_tokens    = 1200
max_attempts      = 3
parallelism       = 1
generation_seed   = 0
# GPU decode batch width for the clip-pass (throughput-only, not fingerprinted).
batch_size        = 6

min_tags_per_kind   = 3
max_tags_per_kind   = 8
min_tag_chars       = 3
max_tag_chars       = 60
min_sentence_chars  = 20
max_sentence_chars  = 240

cluster_max_new_tokens          = 1500
cluster_sample_token_budget     = 18000
cluster_max_clips_per_cluster   = 60
cluster_max_clips_per_user      = 2
cluster_min_tags                = 3
cluster_max_tags                = 12
cluster_min_sentence_chars      = 20
cluster_max_sentence_chars      = 320
cluster_max_attempts            = 10
cluster_model_path              = "./models/Qwen3-30B-A3B-GPTQ-Int4"
cluster_tag_max_chars           = 28
cluster_tag_max_words           = 5
cluster_summary_target_min      = 120
cluster_summary_target_max      = 160
cluster_summary_max_chars       = 200
cluster_gpu_memory_utilization  = 0.90
cluster_max_model_len           = 20480
cluster_enforce_eager           = true
cluster_dedup_max_rounds        = 2

# Per-case stage-1 prompts. One entry per case in modules.labels.cases.REGISTRY.
# The ``video`` body is the original flat ``labels.prompt`` text verbatim — do
# not edit without bumping the labels stage fingerprint (drops all video-case
# ClipLabel rows).
[labels.case_prompts]
video = """
You are performing visual analysis of Instagram Reels.

The aim is not to classify the video into predefined categories. Instead,
generate concise, open-ended descriptors that capture its visual aesthetic
and the kind of cultural sensibility or imagined community it may communicate.

Your analysis must distinguish between:

1. Observable visual features:
   Describe what can be directly grounded in the video: setting, bodies or
   objects shown, styling, composition, camera relation, movement, lighting,
   colour palette, editing rhythm, texture, polish, and mode of self-presentation.

2. Aesthetic interpretation:
   Generate short descriptors for the video's overall visual sensibility.
   These may be abstract, affective, stylistic, or culturally coded, but must
   be supported by the observable visual features.

3. Potential community signalling:
   Generate cautious descriptors for the type of shared taste, lifestyle
   orientation, or aesthetic belonging the video appears to signal.
   Do not assign demographic identities, political identities, sexuality,
   class position, or psychological traits. Phrase these as aesthetic signals,
   not facts about the creator.

Rules:
- Do not use a fixed taxonomy.
- Prefer precise phrases over generic tags such as "beautiful", "aesthetic",
  "cool", or "trendy".
- Generate tags that are useful for comparing this video with other Reels.
- Do not mention anything that is not visually evidenced.
- Abstract descriptors must include a short grounding explanation.
- Use lowercase tags.
- Return valid JSON only.

Return this JSON structure:

{
  "observable_visual_tags": [
    {
      "tag": "string",
      "evidence": "brief visible grounding"
    }
  ],
  "aesthetic_tags": [
    {
      "tag": "string",
      "grounded_in": ["observable tag", "observable tag"],
      "confidence": "high | medium | low"
    }
  ],
  "community_signalling_tags": [
    {
      "tag": "string",
      "grounded_in": ["aesthetic tag", "observable tag"],
      "confidence": "high | medium | low"
    }
  ],
  "one_sentence_visual_reading": "string"
}
"""

spoken = ""
textual = ""

sandwich = """
You are synthesising the multimodal identity of an Instagram Reel from
its visual observations (already produced as a JSON block) plus its
caption, speech transcription, and music descriptors.

Do not classify into fixed categories. Generate grounded descriptors
capturing the combined visual + audio + textual aesthetic and the taste
community it may signal.

Distinguish:

1. Observable multimodal features — what is directly evidenced across
   the visual block and the textual block.
2. Aesthetic interpretation — short, grounded descriptors for the
   combined sensibility.
3. Potential community signalling — cautious descriptors phrased as
   aesthetic signals, not demographic identities.

Rules:
- Do not use a fixed taxonomy.
- Cite evidence from either the visual block or the textual block.
- Abstract descriptors must include a short grounding explanation.
- Use lowercase tags.
- Return valid JSON only.

Return this JSON structure:

{
  "observable_multimodal_tags": [
    {"tag": "string", "evidence": "brief grounding phrase"}
  ],
  "aesthetic_tags": [
    {"tag": "string", "grounded_in": ["observable tag", "observable tag"], "confidence": "high | medium | low"}
  ],
  "community_signalling_tags": [
    {"tag": "string", "grounded_in": ["aesthetic tag", "observable tag"], "confidence": "high | medium | low"}
  ],
  "one_sentence_multimodal_reading": "string"
}
"""

auditory = """
You are analysing the musical identity of an Instagram Reel from a
verbalization of its music information retrieval features (genre,
mood/theme, instrumentation, danceability, engagement, approachability).

Do not classify into fixed categories. Generate grounded descriptors
capturing the musical aesthetic and the taste community the soundtrack
may signal.

Distinguish:

1. Observable music features — what is directly evidenced in the
   supplied text: genre, mood/theme, instrumentation, energy buckets.
2. Aesthetic interpretation — short, grounded descriptors for the
   musical sensibility.
3. Potential community signalling — cautious descriptors phrased as
   aesthetic signals, not demographic identities.

Rules:
- Do not use a fixed taxonomy.
- Quote evidence from the verbalization in each observable entry.
- Abstract descriptors must include a short grounding explanation.
- Use lowercase tags.
- Return valid JSON only.

Return this JSON structure:

{
  "observable_music_tags": [
    {"tag": "string", "evidence": "fragment from the verbalization"}
  ],
  "aesthetic_tags": [
    {"tag": "string", "grounded_in": ["observable tag", "observable tag"], "confidence": "high | medium | low"}
  ],
  "community_signalling_tags": [
    {"tag": "string", "grounded_in": ["aesthetic tag", "observable tag"], "confidence": "high | medium | low"}
  ],
  "one_sentence_music_reading": "string"
}
"""

# Per-case stage-2 cluster prompts. Same body shape across cases; the
# repertoire key is renamed per modality. ``video`` is the previous flat
# ``cluster_prompt`` text verbatim.
[labels.cluster_case_prompts]
video = """
You are synthesising the shared visual identity of a cluster of Instagram
Reels creators. You will receive a JSON list of per-clip analyses (each
with an observable_visual_tags array, an aesthetic_tags array, a
community_signalling_tags array, and one_sentence_visual_reading). These
are representative clips from one cluster.

Identify the recurring visual logic across the supplied clips and
synthesise a cluster-level description. Distinguish between what visibly
recurs (repertoire), how those recurring elements organise an aesthetic
sensibility (aesthetic logic), and what kind of taste community the
overall style may signal — phrased cautiously, as aesthetic signals, not
demographic identities.

Content rules:
- Do not use a fixed taxonomy.
- Do not assign demographic identities, political identities, sexuality,
  class position, or psychological traits.
- Ground every aesthetic_logic entry in repertoire tags by name.
- Keep every tag to at most 4 words. Prefer compact noun phrases; avoid
  filler/connector words (of, with, and, in, on, the, a, an).
- Prefer precise phrases over generic descriptors such as "aesthetic",
  "cool", or "trendy".

Output size constraints — STRICTLY ENFORCED:
- dominant_visual_repertoire: 3 to 12 entries. Once you have written 12,
  close the array and continue. Do not invent near-duplicate entries.
- dominant_aesthetic_logic: 3 to 12 entries. Same cap.
- internal_variations: 0 to 4 entries. Usually 0 or 1; leave empty if
  the cluster has no clear sub-strand.
- tool_tags: 3 to 10 short string tags.
- Never repeat a near-identical phrase across entries of the same array.

Return ONLY a single JSON object matching EXACTLY this shape (placeholders
in angle brackets show the type of value; the actual output must contain
real content, not the placeholders):

{
  "cluster_label": "<short label phrase>",
  "cluster_summary": "<one or two sentences capturing the shared visual identity>",
  "dominant_visual_repertoire": [
    {"tag": "<short tag>", "description": "<one sentence>", "recurrence": "dominant"},
    {"tag": "<short tag>", "description": "<one sentence>", "recurrence": "frequent"},
    {"tag": "<short tag>", "description": "<one sentence>", "recurrence": "occasional"}
  ],
  "dominant_aesthetic_logic": [
    {"tag": "<short tag>", "grounded_in": ["<repertoire tag>"], "description": "<one sentence>"},
    {"tag": "<short tag>", "grounded_in": ["<repertoire tag>", "<repertoire tag>"], "description": "<one sentence>"},
    {"tag": "<short tag>", "grounded_in": ["<repertoire tag>"], "description": "<one sentence>"}
  ],
  "taste_signalling": {"label": "<short label>", "description": "<one sentence>", "confidence": "medium"},
  "visibility_orientation": {"label": "<short label>", "description": "<one sentence>", "confidence": "low"},
  "internal_variations": [
    {"variation": "<short label>", "description": "<one sentence>"}
  ],
  "boundary_notes": "<one sentence>",
  "tool_tags": ["<short tag>", "<short tag>", "<short tag>"]
}

Strict JSON rules:
- NO trailing commas anywhere. The last entry of every array and every
  object has NO comma after it.
- All strings double-quoted; never single-quoted.
- Each top-level key present exactly once.
- `recurrence` MUST be one of: "dominant", "frequent", "occasional".
- `confidence` MUST be one of: "high", "medium", "low".
- `grounded_in` entries MUST exactly match a tag string that appears in
  the `dominant_visual_repertoire` array (copy the tag verbatim).
- `dominant_visual_repertoire`, `dominant_aesthetic_logic`, and
  `internal_variations` are arrays of OBJECTS with the fields shown,
  NOT arrays of strings.
- `taste_signalling` and `visibility_orientation` are single OBJECTS,
  NOT arrays.
- `tool_tags` is an array of bare strings.
- Use ONLY ASCII double quotes (the " character, U+0022). Do NOT use
  typographic / "smart" / curly quotes (U+201C, U+201D, U+2018, U+2019).
  Every quote in your output must be a plain straight " character.
- Key names in your output MUST be byte-identical to those shown in the
  example above. Do not paraphrase, abbreviate, or grammatically adjust
  them. Write "dominant_aesthetic_logic" exactly — NOT
  "dominant_aesthetic_logical".

cluster_label rules — STRICTLY ENFORCED:
- MAXIMUM 40 CHARACTERS TOTAL (count every character including spaces).
  Outputs over 40 characters will be REJECTED and you will be asked to
  retry. Count the characters yourself before emitting.
- Prefer 2 to 4 words. A single concise noun phrase is best.
- BANNED filler words (do NOT use): "aesthetic", "aesthetics",
  "curated", "cluster", "cluster of". Every cluster is one of these;
  using them tells the reader nothing. Be specific.
- BANNED structures: "X with Y", "X across A, B, and C", "X and Y" as
  the entire label. Pick ONE noun phrase, not a list of ingredients.
- Use Title Case.

GOOD cluster_label examples (note the brevity):
- "Nightclub Visual Culture"        (24 chars)
- "Domestic Craft Rituals"          (22 chars)
- "Cinematic Stillness"             (19 chars)
- "Performance Realism"             (19 chars)
- "Ambient Hip-Hop"                 (15 chars)
- "Synth-Driven Pop"                (16 chars)

BAD cluster_label examples:
- "curated visual storytelling across performance, documentary, and digital aesthetics"
  (83 chars; banned "curated" + "aesthetics"; list structure)
- "Curated Stillness and Reflective Digital Aesthetics"
  (51 chars; banned "curated" + "aesthetics"; "X and Y" structure)

Emit only the JSON object. No code fences, no preamble, no commentary.
"""

