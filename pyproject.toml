[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inst2vec"
version = "0.1.0"
description = "A research-oriented codebase related to parse, embed and interpret Instagram accounts."
readme = "README.md"
authors = [{name = "molchalih"}]
license = {text = "Apache-2.0"}
keywords = ["instagram", "embeddings", "clustering", "umap", "hdbscan", "qwen", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Capped below 3.13: the GPU cluster-label stack (vllm + the cuml/cudf `gpu`
# extra) only co-resolves on the 3.12 the box and prod images run.
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "hdbscan>=0.8.42",
    "hikerapi>=1.7.9",
    "httpx>=0.28.1",
    "huggingface-hub>=1.14.0",
    "json-repair>=0.30",
    "lingua-language-detector>=2.2.0",
    "matplotlib>=3.10.9",
    "faster-whisper>=1.2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "python-dotenv>=1.2.2",
    "qwen-vl-utils>=0.0.14",
    "quarto>=0.1.0",
    "rich>=15.0.0",
    "silero-vad>=5.1",
    "sqlalchemy>=2.0.41",
    "torch>=2.11.0",
    "torchcodec>=0.12.0",
    "torchvision>=0.26.0",
    "transformers>=5.8.0",
    "umap-learn>=0.5.12",
    "setuptools",
    "essentia-tensorflow>=2.1b6.dev1389,<2.1b6.dev1438",
    "onnxruntime-gpu>=1.17,<2; sys_platform == 'linux'",
    "onnxruntime>=1.17,<2; sys_platform == 'darwin'",
    # CUDA 12 / cuDNN 9 runtime libs for the onnxruntime-gpu CUDA provider.
    # Without these on the library path it cannot load libcudnn.so.9 and the
    # MIR ONNX path silently falls back to CPU (see core/vendor/onnx_session).
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12; sys_platform == 'linux'",
    "nvidia-cuda-nvrtc-cu12; sys_platform == 'linux'",
    "nvidia-cufft-cu12; sys_platform == 'linux'",
    "nvidia-curand-cu12; sys_platform == 'linux'",
    # Cluster-label generation (Qwen3-30B-A3B-GPTQ-Int4 + schema-constrained
    # JSON decoding) runs in-process via vLLM's offline LLM on the Linux GPU
    # host; the labels stage lazy-imports it so the arm64 dev box never needs
    # it. vLLM brings its own structured-output (xgrammar) + GPTQ MoE kernels.
    "vllm>=0.21; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/molchalih/inst2vec"
Repository = "https://github.com/molchalih/inst2vec"
Issues = "https://github.com/molchalih/inst2vec/issues"

[dependency-groups]
dev = [
    "autoflake>=2.3.3",
    "pytest>=9.0.3",
    "radon>=6.0.1",
    "ruff>=0.15.12",
    "ty>=0.0.35",
]
serving = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
]
gpu = [
    "ninja>=1.13.0",
    "flash-attn>=2.8.3",
    "cython",
]
analysis = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "tabulate>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "modules", "scripts"]

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[tool.uv.extra-build-dependencies]
hdbscan = ["setuptools", "cython"]
flash-attn = ["torch", "ninja"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
    "ignore:`torch.jit.load` is deprecated:DeprecationWarning",
    "ignore::PendingDeprecationWarning:seaborn.categorical",
]

[tool.ruff]
exclude = ["core/vendor"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ty.src]
include = ["core", "modules", "scripts"]
exclude = ["core/vendor"]

[tool.ty.analysis]
replace-imports-with-any = ["sqlalchemy.*", "sqlalchemy.orm.*"]
