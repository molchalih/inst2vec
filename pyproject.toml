[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inst2vec"
version = "0.1.0"
description = "A research-oriented codebase related to parse, embed and interpret Instagram accounts."
readme = "README.md"
authors = [{name = "molchalih"}]
license = {text = "Apache-2.0"}
keywords = ["instagram", "embeddings", "clustering", "umap", "hdbscan", "qwen", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "hdbscan>=0.8.42",
    "hikerapi>=1.7.9",
    "httpx>=0.28.1",
    "huggingface-hub>=1.14.0",
    "lingua-language-detector>=2.2.0",
    "matplotlib>=3.10.9",
    "openai-whisper>=20250625",
    "pydantic>=2.0",
    "pyacrcloud>=1.0.11",
    "python-dotenv>=1.2.2",
    "qwen-vl-utils>=0.0.14",
    "quarto>=0.1.0",
    "rich>=15.0.0",
    "silero-vad>=5.1",
    "sqlalchemy>=2.0.41",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.8.0",
    "umap-learn>=0.5.12",
    "setuptools",
    "boto3>=1.43.9",
]

[project.urls]
Homepage = "https://github.com/molchalih/inst2vec"
Repository = "https://github.com/molchalih/inst2vec"
Issues = "https://github.com/molchalih/inst2vec/issues"

[dependency-groups]
dev = [
    "autoflake>=2.3.3",
    "moto[s3]>=5.2.1",
    "pytest>=9.0.3",
    "radon>=6.0.1",
    "ruff>=0.15.12",
    "ty>=0.0.35",
]
embedder = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
]
gpu = [
    "ninja>=1.13.0",
    "flash-attn>=2.8.3",
    "cython",
]
gemini = [
    "google-genai>=1.0",
]
analysis = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "tabulate>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "modules", "scripts"]

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools"]
hdbscan = ["setuptools", "cython"]
flash-attn = ["torch", "ninja"]

[tool.ruff]
exclude = ["core/vendor"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ty.src]
include = ["core", "modules", "scripts"]
exclude = ["core/vendor", "modules/embeddings/gemini.py"]

[tool.ty.analysis]
replace-imports-with-any = ["sqlalchemy.*", "sqlalchemy.orm.*"]
