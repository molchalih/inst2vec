[project]
name = "inst2vec"
version = "0.1.0"
description = "A research-oriented codebase related to parse, embed and interpret Instagram accounts."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "hdbscan>=0.8.42",
    "hikerapi>=1.7.9",
    "httpx>=0.28.1",
    "huggingface-hub>=1.14.0",
    "lingua-language-detector>=2.2.0",
    "matplotlib>=3.10.9",
    "openai-whisper>=20250625",
    "pyacrcloud>=1.0.11",
    "python-dotenv>=1.2.2",
    "quarto>=0.1.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.41",
    "torch>=2.11.0",
    "transformers>=5.8.0",
    "umap-learn>=0.5.12",
]

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools"]

[dependency-groups]
gpu = [
    "ninja>=1.13.0",
    "flash-attn>=2.8.3",
]