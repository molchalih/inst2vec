<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tells the user agent this page is dark before any CSS is
         parsed, so the browser's first-paint canvas color matches
         our background instead of the default white. -->
    <meta name="color-scheme" content="dark" />
    <title>inst2vec atlas</title>
    <style>
      /* Paint-blocking base: CSS variables and root layout must be
         present on the first frame, before the JS bundle (and the
         Tailwind-emitted utilities that depend on them) loads.
         Values mirror tokens.ts; channel form enables Tailwind
         <alpha-value> substitution. */
      :root {
        color-scheme: dark;
        --bg-canvas: 11 18 32;
        --fg-default: 226 232 240;
        --fg-muted: 148 163 184;

        /* Clip-label tag chips: observable / aesthetic / community. */
        --bg-chip-observable: rgb(50 60 80 / 0.45);
        --fg-chip-observable: rgb(220 226 240);
        --border-chip-observable: rgb(80 95 130 / 0.7);

        --bg-chip-aesthetic: rgb(70 60 90 / 0.45);
        --fg-chip-aesthetic: rgb(228 220 240);
        --border-chip-aesthetic: rgb(110 95 140 / 0.7);

        --bg-chip-community: rgb(90 70 80 / 0.45);
        --fg-chip-community: rgb(240 224 226);
        --border-chip-community: rgb(140 100 110 / 0.7);

        --border-chip-warn: rgb(220 170 70 / 0.7);
      }
      html, body, #root {
        height: 100%;
        margin: 0;
        background: rgb(var(--bg-canvas));
        color: rgb(var(--fg-default));
        overflow: hidden;
      }
      /* Register `--accent` as a typed colour custom property so the
         inspector can transition it and animate the gradient smoothly
         on pane swap. The initial value is harmless before the first
         selection sets it. */
      @property --accent {
        syntax: "<color>";
        inherits: true;
        initial-value: transparent;
      }
      /* Single source of truth for the inspector's accent morph.
         Inline `transition: --accent ...` is unreliable across browsers
         for registered custom properties; declaring it on a stable CSS
         class fixes it. Consumer passes `--accent-morph-ms` via inline
         style for timing. */
      .inspector-accent-host {
        transition:
          --accent var(--accent-morph-ms, 360ms) cubic-bezier(0.22, 1, 0.36, 1);
        will-change: --accent;
      }
      /* Pane-content slide. Two animations keyed off CSS classes so
         each phase change cleanly restarts (animation-name flip).
         `forwards` keeps the end-state pinned during steady phases.
         The wrapper is `overflow: hidden` and these animations push
         the content past its bounds — hence "overflowing". */
      .inspector-content {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        /* X clip for the slide animation; Y scrolls so per-clip tag
           rows below the fold remain reachable. Hide the scrollbar so
           the editorial column stays chromeless. */
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: none;
        will-change: transform, opacity;
      }
      .inspector-content::-webkit-scrollbar { display: none; }
      .inspector-content--in {
        animation: inspector-content-in
                   var(--content-slide-ms, 420ms)
                   cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .inspector-content--out {
        animation: inspector-content-out
                   var(--content-slide-ms, 420ms)
                   cubic-bezier(0.55, 0, 0.78, 0) forwards;
      }
      @keyframes inspector-content-in {
        from { transform: translateX(-100%); opacity: 0; }
        to   { transform: translateX(0);     opacity: 1; }
      }
      @keyframes inspector-content-out {
        from { transform: translateX(0);      opacity: 1; }
        to   { transform: translateX(-100%);  opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
