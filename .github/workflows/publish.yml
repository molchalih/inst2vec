name: Publish serving image

# Builds the slim serving image (deploy/Dockerfile), publishes it to GHCR and keyless-cosign-SIGNS it.
#
# WHY THIS EXISTS. The serving stack used to be built ON the target host by a self-hosted runner
# (deploy-serving.yml), from a deploy/ bundle that was never in git. That meant the deployed artifact
# had no provenance: nothing tied the running image to a commit, and nothing could verify it. The
# host now refuses to run an image it cannot verify, so the build moved here, to a GitHub-hosted
# runner, and the Dockerfile moved into the repo.
#
# ⚠ The consuming side pins the signature identity to:
#     https://github.com/molchalih/inst2vec/.github/workflows/publish.yml@refs/heads/main
# Renaming this file breaks deployment until that pin is updated. Signatures produced on a branch do
# NOT match it — only pushes to main count.
#
# The build context is the REPO ROOT, not deploy/: the Dockerfile COPYs repo-relative source
# packages (core/, modules/, services/atlas_api/, scripts/offload_serving.py, config.toml,
# alembic.ini). Its build-time check fails the image if a heavy/GPU dependency leaks into the closure.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/Dockerfile'
      - 'core/**'
      - 'modules/**'
      - 'services/atlas_api/**'
      - 'scripts/offload_serving.py'
      - 'config.toml'
      - 'alembic.ini'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/api

jobs:
  build-sign-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to GHCR
      id-token: write      # keyless cosign OIDC — without this `cosign sign` cannot mint a certificate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `main` is the CHANNEL the deployer follows; the sha tag stays for provenance and rollback.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - uses: sigstore/cosign-installer@v3

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=serving-api
          cache-to: type=gha,mode=max,scope=serving-api

      # Sign the DIGEST, never the moving tag: the tag is what moves, the digest is what runs.
      - name: Cosign sign (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
