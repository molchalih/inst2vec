# Alembic multi-database configuration.
#
# Three logical databases, each selected by `-n <name>`:
#   alembic -n main     upgrade head
#   alembic -n identity upgrade head
#   alembic -n serving  upgrade head
#
# URLs are NOT stored here — env.py resolves them from DATABASE_URL,
# IDENTITY_DB_URL and SERVING_DATABASE_URL (the same source as core.config),
# so the same migrations target SQLite (dev) or Postgres (prod) unchanged.

[alembic]
script_location = %(here)s/core/database/migrations
path_separator = os

[main]
script_location = %(here)s/core/database/migrations
path_separator = os
version_locations = %(here)s/core/database/migrations/versions

[identity]
script_location = %(here)s/core/database/migrations
path_separator = os
version_locations = %(here)s/core/database/migrations/versions_identity

[serving]
script_location = %(here)s/core/database/migrations
path_separator = os
version_locations = %(here)s/core/database/migrations/versions_serving

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
